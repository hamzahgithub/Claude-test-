<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"
     width="1200" height="800" role="img"
     aria-label="مخطط معمارية نظام قياس مستوى الماء بحساس راداري ورابط لاسلكي">

  <title>معمارية نظام قياس مستوى الماء (حساس راداري + رابط لاسلكي)</title>
  <desc>مخطط معمارية يوضح عقدة الحساس الراداري فوق الخزان، ووحدة المتحكم والعرض، والرابط اللاسلكي بينهما، وتدفق البيانات من القياس حتى التحكم بالمضخة.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3b57"/>
    </marker>
    <marker id="arrowRF" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a4b00"/>
    </marker>
    <marker id="dimStart" viewBox="0 0 10 10" refX="1" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#0f5c4a"/>
    </marker>
    <marker id="dimEnd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f5c4a"/>
    </marker>
    <marker id="beamArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a2f9e"/>
    </marker>

    <style>
      .bg      { fill: #f4f7fb; }
      .ttl     { font-family: sans-serif; font-size: 27px; font-weight: bold; fill: #14293d; }
      .sub     { font-family: sans-serif; font-size: 15px; fill: #4a5f74; }
      .boxttl  { font-family: sans-serif; font-size: 19px; font-weight: bold; fill: #14293d; }
      .item    { font-family: sans-serif; font-size: 14.5px; fill: #1d3346; }
      .note    { font-family: sans-serif; font-size: 13px; fill: #4a5f74; }
      .rf      { font-family: sans-serif; font-size: 14.5px; font-weight: bold; fill: #8a4b00; }
      .dim     { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #0f5c4a; }
      .flow    { font-family: sans-serif; font-size: 14px; fill: #14293d; }
      .flowno  { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .nodeA   { fill: #e4f0fb; stroke: #2b6ea8; stroke-width: 2.5; }
      .nodeB   { fill: #e7f3ec; stroke: #2a7a55; stroke-width: 2.5; }
      .card    { fill: #ffffff; stroke: #9fb3c6; stroke-width: 1.4; }
      .flowbox { fill: #ffffff; stroke: #1f3b57; stroke-width: 1.6; }
      .legend  { fill: #ffffff; stroke: #c2cedb; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- خلفية صريحة لضمان القراءة في الوضعين الفاتح والداكن -->
  <rect x="0" y="0" width="1200" height="800" class="bg"/>
  <rect x="6" y="6" width="1188" height="788" fill="none" stroke="#c2cedb" stroke-width="2" rx="10"/>

  <!-- العنوان -->
  <text x="1150" y="52" class="ttl" direction="rtl" text-anchor="end">معمارية النظام — جهاز قياس مستوى الماء</text>
  <text x="1150" y="78" class="sub" direction="rtl" text-anchor="end">حساس راداري (قياس المسافة إلى سطح الماء من الأعلى) + رابط لاسلكي إلى وحدة المتحكم والعرض</text>
  <line x1="50" y1="92" x2="1150" y2="92" stroke="#c2cedb" stroke-width="1.5"/>

  <!-- ============ رسم الخزان وشعاع الرادار ============ -->
  <g id="tank">
    <text x="330" y="126" class="boxttl" direction="rtl" text-anchor="end">الخزان / البئر ومبدأ القياس</text>

    <!-- جسم الخزان -->
    <rect x="70" y="150" width="260" height="400" fill="#ffffff" stroke="#6b7f93" stroke-width="2.5" rx="6"/>
    <!-- الماء -->
    <rect x="72" y="380" width="256" height="168" fill="#bcdcf5" stroke="none"/>
    <!-- سطح الماء -->
    <line x1="72" y1="380" x2="328" y2="380" stroke="#1f6fa8" stroke-width="3"/>
    <text x="320" y="404" class="note" direction="rtl" text-anchor="end">سطح الماء</text>
    <!-- القاع -->
    <line x1="70" y1="548" x2="330" y2="548" stroke="#6b7f93" stroke-width="3"/>
    <text x="320" y="568" class="note" direction="rtl" text-anchor="end">قاع الخزان (المرجع)</text>

    <!-- الحساس الراداري مثبت في الأعلى -->
    <rect x="160" y="126" width="80" height="26" fill="#efe1f8" stroke="#7a2f9e" stroke-width="2" rx="4"/>
    <text x="200" y="144" class="note" direction="rtl" text-anchor="middle" fill="#5a1f78">حساس راداري</text>

    <!-- شعاع الرادار: نزولاً ثم انعكاس -->
    <path d="M 190 152 L 178 378" stroke="#7a2f9e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#beamArrow)"/>
    <path d="M 210 378 L 222 154" stroke="#7a2f9e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#beamArrow)"/>
    <text x="264" y="268" class="note" direction="rtl" text-anchor="middle" fill="#5a1f78">إرسال / انعكاس</text>

    <!-- المسافة d من الحساس إلى سطح الماء -->
    <line x1="110" y1="152" x2="110" y2="380" stroke="#0f5c4a" stroke-width="2"
          marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
    <text x="124" y="262" class="dim" direction="rtl" text-anchor="start">d</text>
    <text x="124" y="282" class="note" direction="rtl" text-anchor="start">المسافة المقيسة</text>

    <!-- الارتفاع h من القاع إلى سطح الماء -->
    <line x1="300" y1="380" x2="300" y2="548" stroke="#0f5c4a" stroke-width="2"
          marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
    <text x="288" y="456" class="dim" direction="rtl" text-anchor="end">h</text>
    <text x="288" y="476" class="note" direction="rtl" text-anchor="end">مستوى الماء</text>

    <!-- علاقة الاشتقاق -->
    <rect x="62" y="588" width="276" height="44" class="card" rx="6"/>
    <text x="326" y="608" class="item" direction="rtl" text-anchor="end">h = (ارتفاع التثبيت الكلي) − d</text>
    <text x="326" y="626" class="note" direction="rtl" text-anchor="end">قيم الأبعاد تُحدَّد لاحقًا حسب الخزان</text>
  </g>

  <!-- ============ عقدة الحساس ============ -->
  <g id="sensor-node">
    <rect x="372" y="110" width="320" height="330" class="nodeA" rx="12"/>
    <text x="672" y="140" class="boxttl" direction="rtl" text-anchor="end">١) عقدة الحساس (فوق الخزان)</text>
    <line x1="392" y1="152" x2="672" y2="152" stroke="#2b6ea8" stroke-width="1.2"/>

    <rect x="392" y="164" width="280" height="40" class="card" rx="6"/>
    <text x="660" y="189" class="item" direction="rtl" text-anchor="end">حساس مستوى راداري (قياس المسافة)</text>

    <rect x="392" y="214" width="280" height="40" class="card" rx="6"/>
    <text x="660" y="239" class="item" direction="rtl" text-anchor="end">متحكم صغير منخفض الاستهلاك</text>

    <rect x="392" y="264" width="280" height="40" class="card" rx="6"/>
    <text x="660" y="289" class="item" direction="rtl" text-anchor="end">وحدة راديو sub-GHz (إرسال)</text>

    <rect x="392" y="314" width="280" height="40" class="card" rx="6"/>
    <text x="660" y="339" class="item" direction="rtl" text-anchor="end">بطارية + لوح شمسي + منظّم شحن</text>

    <rect x="392" y="364" width="280" height="40" class="card" rx="6"/>
    <text x="660" y="389" class="item" direction="rtl" text-anchor="end">صندوق محكم ضد الماء + هوائي</text>

    <text x="672" y="426" class="note" direction="rtl" text-anchor="end">تعمل دوريًا ثم تعود إلى وضع السكون</text>
  </g>

  <!-- ربط الخزان بعقدة الحساس -->
  <path d="M 372 200 L 246 138" stroke="#1f3b57" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="372" y="182" class="note" direction="rtl" text-anchor="end">تثبيت الحساس أعلى الخزان</text>

  <!-- ============ الرابط اللاسلكي ============ -->
  <g id="rf-link">
    <!-- موجة منقّطة بين العقدتين -->
    <path d="M 692 250 q 20 -26 40 0 q 20 26 40 0 q 20 -26 40 0 q 20 26 40 0 q 20 -26 40 0"
          fill="none" stroke="#c76a12" stroke-width="3" stroke-dasharray="8 5"
          marker-end="url(#arrowRF)"/>
    <text x="820" y="216" class="rf" direction="rtl" text-anchor="middle">رابط لاسلكي RF</text>
    <text x="820" y="292" class="note" direction="rtl" text-anchor="middle">وحدة راديو sub-GHz</text>
    <text x="820" y="312" class="note" direction="rtl" text-anchor="middle">(التردد والمدى يُحددان لاحقًا)</text>
    <!-- هوائيان -->
    <path d="M 692 250 l -10 -22 M 692 250 l 2 -24" stroke="#c76a12" stroke-width="2.5" fill="none"/>
    <path d="M 932 250 l 10 -22 M 932 250 l -2 -24" stroke="#c76a12" stroke-width="2.5" fill="none"/>
  </g>

  <!-- ============ وحدة المتحكم والعرض ============ -->
  <g id="controller-unit">
    <rect x="812" y="110" width="330" height="330" class="nodeB" rx="12"/>
    <text x="1122" y="140" class="boxttl" direction="rtl" text-anchor="end">٢) وحدة المتحكم والعرض</text>
    <line x1="832" y1="152" x2="1122" y2="152" stroke="#2a7a55" stroke-width="1.2"/>

    <rect x="832" y="164" width="290" height="40" class="card" rx="6"/>
    <text x="1110" y="189" class="item" direction="rtl" text-anchor="end">وحدة راديو sub-GHz (استقبال)</text>

    <rect x="832" y="214" width="290" height="40" class="card" rx="6"/>
    <text x="1110" y="239" class="item" direction="rtl" text-anchor="end">المتحكم الرئيسي + منطق التحكم</text>

    <rect x="832" y="264" width="290" height="40" class="card" rx="6"/>
    <text x="1110" y="289" class="item" direction="rtl" text-anchor="end">شاشة عرض + أزرار + مؤشرات/إنذار</text>

    <rect x="832" y="314" width="290" height="40" class="card" rx="6"/>
    <text x="1110" y="339" class="item" direction="rtl" text-anchor="end">مخرج ريلاي للتحكم بالمضخة</text>

    <rect x="832" y="364" width="290" height="40" class="card" rx="6"/>
    <text x="1110" y="389" class="item" direction="rtl" text-anchor="end">تغذية من الشبكة + منظّم جهد</text>

    <text x="1122" y="426" class="note" direction="rtl" text-anchor="end">تشغيل/إيقاف تلقائي عند حدّي الامتلاء والفراغ</text>
  </g>

  <!-- المضخة -->
  <g id="pump">
    <rect x="952" y="470" width="190" height="52" class="card" rx="8"/>
    <circle cx="986" cy="496" r="15" fill="#e7f3ec" stroke="#2a7a55" stroke-width="2"/>
    <path d="M 986 486 L 996 496 L 986 506 z" fill="#2a7a55"/>
    <text x="1128" y="502" class="item" direction="rtl" text-anchor="end">المضخة (حِمل التحكم)</text>
    <path d="M 1000 440 L 1000 470" stroke="#1f3b57" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ تدفق البيانات ============ -->
  <g id="dataflow">
    <line x1="50" y1="660" x2="1150" y2="660" stroke="#c2cedb" stroke-width="1.5"/>
    <text x="1150" y="690" class="boxttl" direction="rtl" text-anchor="end">تدفق البيانات</text>

    <!-- الخطوات من اليمين إلى اليسار -->
    <rect x="950" y="706" width="200" height="54" class="flowbox" rx="8"/>
    <circle cx="966" cy="722" r="11" fill="#1f3b57"/>
    <text x="966" y="727" class="flowno" text-anchor="middle">1</text>
    <text x="1138" y="732" class="flow" direction="rtl" text-anchor="end">قياس المسافة بالرادار</text>
    <text x="1138" y="750" class="note" direction="rtl" text-anchor="end">عقدة الحساس</text>

    <rect x="726" y="706" width="200" height="54" class="flowbox" rx="8"/>
    <circle cx="742" cy="722" r="11" fill="#1f3b57"/>
    <text x="742" y="727" class="flowno" text-anchor="middle">2</text>
    <text x="914" y="732" class="flow" direction="rtl" text-anchor="end">معالجة وتحويل إلى مستوى</text>
    <text x="914" y="750" class="note" direction="rtl" text-anchor="end">متحكم العقدة</text>

    <rect x="502" y="706" width="200" height="54" class="flowbox" rx="8"/>
    <circle cx="518" cy="722" r="11" fill="#c76a12"/>
    <text x="518" y="727" class="flowno" text-anchor="middle">3</text>
    <text x="690" y="732" class="flow" direction="rtl" text-anchor="end">إرسال لاسلكي RF</text>
    <text x="690" y="750" class="note" direction="rtl" text-anchor="end">رابط الراديو</text>

    <rect x="278" y="706" width="200" height="54" class="flowbox" rx="8"/>
    <circle cx="294" cy="722" r="11" fill="#c76a12"/>
    <text x="294" y="727" class="flowno" text-anchor="middle">4</text>
    <text x="466" y="732" class="flow" direction="rtl" text-anchor="end">استقبال وفكّ الرسالة</text>
    <text x="466" y="750" class="note" direction="rtl" text-anchor="end">وحدة المتحكم</text>

    <rect x="54" y="706" width="200" height="54" class="flowbox" rx="8"/>
    <circle cx="70" cy="722" r="11" fill="#2a7a55"/>
    <text x="70" y="727" class="flowno" text-anchor="middle">5</text>
    <text x="242" y="732" class="flow" direction="rtl" text-anchor="end">عرض + تحكم بالمضخة</text>
    <text x="242" y="750" class="note" direction="rtl" text-anchor="end">شاشة وريلاي</text>

    <!-- أسهم التدفق (اتجاه من اليمين إلى اليسار) -->
    <path d="M 950 733 L 930 733" stroke="#1f3b57" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 726 733 L 706 733" stroke="#1f3b57" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 502 733 L 482 733" stroke="#c76a12" stroke-width="2" marker-end="url(#arrowRF)"/>
    <path d="M 278 733 L 258 733" stroke="#1f3b57" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ مفتاح الرموز ============ -->
  <g id="legend">
    <rect x="372" y="470" width="560" height="112" class="legend" rx="8"/>
    <text x="916" y="496" class="boxttl" direction="rtl" text-anchor="end">مفتاح الرموز</text>

    <path d="M 838 518 l -40 0" stroke="#1f3b57" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="786" y="523" class="note" direction="rtl" text-anchor="end">ارتباط سلكي / داخلي</text>

    <path d="M 838 546 q -12 -14 -24 0 q -12 14 -24 0" fill="none" stroke="#c76a12" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="786" y="551" class="note" direction="rtl" text-anchor="end">ارتباط لاسلكي RF</text>

    <path d="M 620 518 l -40 0" stroke="#7a2f9e" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="568" y="523" class="note" direction="rtl" text-anchor="end">شعاع الرادار</text>

    <line x1="620" y1="546" x2="580" y2="546" stroke="#0f5c4a" stroke-width="2"
          marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
    <text x="568" y="551" class="note" direction="rtl" text-anchor="end">أبعاد القياس d و h</text>

    <text x="916" y="572" class="note" direction="rtl" text-anchor="end">ملاحظة: الأسماء عامة — المواصفات الرقمية (المدى، التردد، الدقة، الاستهلاك) تُحدَّد في وثيقة أخرى.</text>
  </g>

</svg>
